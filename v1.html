<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Make 10 — Number Puzzle Game</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{height:100%;background:#fff;}
body{font-family:'Outfit',sans-serif;color:#1a1a1a;touch-action:none;overflow-y:auto;overflow-x:hidden;}

/* 전체 레이아웃 — 세로 스크롤 */
.app{display:flex;flex-direction:column;align-items:center;min-height:100%;width:100%;padding:12px 16px 40px;}

/* 상단 바 */
.topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:850px;padding:8px 4px;margin-bottom:8px;}
.logo{display:flex;align-items:baseline;gap:4px;}
.logo-m{font-size:16px;font-weight:600;color:#aaa;}
.logo-10{font-size:24px;font-weight:900;color:#FF6B00;}
.timer{font-size:28px;font-weight:900;color:#FF4D6D;font-variant-numeric:tabular-nums;}
.timer.warn{animation:blink 0.5s infinite alternate;}
@keyframes blink{from{opacity:1}to{opacity:0.3}}
.score-box{text-align:right;}
.score-label{font-size:9px;color:#aaa;letter-spacing:1px;}
.score-val{font-size:24px;font-weight:900;color:#FF6B00;}

/* 보드 — 타일 2배 확대 */
.board{
  display:grid;grid-template-columns:repeat(17,1fr);gap:3px;
  width:100%;max-width:850px;
  padding:4px;
  margin-bottom:8px;
}

/* 귤 타일 */
.t{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;
  transition:transform 0.12s;position:relative;
}
.t:hover{transform:scale(1.06);}
.t .bg{position:absolute;width:95%;height:95%;z-index:0;}
.t .bg svg{width:100%;height:100%;}
.t .num{position:relative;z-index:1;font-size:clamp(16px,2.8vw,28px);font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.4);line-height:1;}
.t.sel{transform:scale(0.85);filter:brightness(1.15);}

/* 모이기 */
.t.gather{transition:transform 0.3s ease-in;pointer-events:none;}

/* 튕겨나감 */
@keyframes f0{0%{transform:scale(1.3);opacity:1}100%{transform:translate(80px,-100px) scale(0.2) rotate(60deg);opacity:0}}
@keyframes f1{0%{transform:scale(1.3);opacity:1}100%{transform:translate(-90px,-70px) scale(0.2) rotate(-55deg);opacity:0}}
@keyframes f2{0%{transform:scale(1.3);opacity:1}100%{transform:translate(70px,90px) scale(0.2) rotate(70deg);opacity:0}}
@keyframes f3{0%{transform:scale(1.3);opacity:1}100%{transform:translate(-80px,100px) scale(0.2) rotate(-65deg);opacity:0}}
@keyframes f4{0%{transform:scale(1.3);opacity:1}100%{transform:translate(100px,30px) scale(0.2) rotate(45deg);opacity:0}}
@keyframes f5{0%{transform:scale(1.3);opacity:1}100%{transform:translate(-100px,-40px) scale(0.2) rotate(-70deg);opacity:0}}
.t.f0{animation:f0 .45s ease-out forwards;pointer-events:none;}
.t.f1{animation:f1 .45s ease-out forwards;pointer-events:none;}
.t.f2{animation:f2 .45s ease-out forwards;pointer-events:none;}
.t.f3{animation:f3 .45s ease-out forwards;pointer-events:none;}
.t.f4{animation:f4 .45s ease-out forwards;pointer-events:none;}
.t.f5{animation:f5 .45s ease-out forwards;pointer-events:none;}
.t.dead{opacity:0;pointer-events:none;}

/* 하단 힌트 */
.hint{text-align:center;font-size:11px;color:#ccc;padding:4px;margin-bottom:16px;}

/* 드래그 박스 */
#box{position:fixed;border:2px solid rgba(255,140,0,0.7);background:rgba(255,140,0,0.08);pointer-events:none;display:none;z-index:999;border-radius:4px;}

/* 실시간 합계 — 비활성 */
#ls{display:none!important;}

/* +N 팝업 */
@keyframes sUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.sp{position:fixed;pointer-events:none;z-index:1001;font-size:22px;font-weight:900;color:#FF6B00;animation:sUp .8s ease forwards;}

/* 하단 패널 — 랭킹 + 히스토리 가로 배치 */
.bottom-panels{
  display:flex;gap:16px;width:100%;max-width:850px;
}
.panel{
  flex:1;background:#fafafa;border-radius:14px;padding:16px;
  border:1px solid #f0f0f0;min-height:120px;max-height:260px;overflow-y:auto;
}
.panel-title{
  font-size:11px;color:#aaa;letter-spacing:2px;font-weight:700;
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eee;
}
.rank-item{
  display:flex;align-items:center;gap:8px;padding:7px 4px;
  border-bottom:1px solid #f0f0f0;
}
.rank-item:last-child{border:none;}
.rank-pos{font-size:15px;font-weight:900;width:24px;text-align:center;}
.rank-pos.g{color:#FFD700;} .rank-pos.s{color:#aaa;} .rank-pos.b{color:#CD7F32;}
.rank-name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-score{font-size:14px;font-weight:800;color:#FF6B00;}
.rank-empty{font-size:12px;color:#ddd;text-align:center;padding:20px 0;}
/* 히스토리 */
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f0f0f0;}
.hist-item:last-child{border:none;}
.hist-num{font-size:11px;color:#ccc;width:20px;text-align:center;}
.hist-score{font-size:13px;font-weight:800;color:#1a1a1a;flex:1;}
.hist-date{font-size:10px;color:#bbb;}

@media(max-width:600px){
  .bottom-panels{flex-direction:column;gap:10px;}
  .panel{max-height:180px;}
}

/* 게임오버 */
.ov{position:fixed;inset:0;background:rgba(255,255,255,0.9);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(8px);}
.ov.on{display:flex;}
.ovc{background:#fff;border-radius:24px;padding:36px 28px;text-align:center;width:92%;max-width:340px;border:1px solid #eee;box-shadow:0 20px 60px rgba(0,0,0,0.08);}
.ovc .ol{font-size:11px;color:#aaa;letter-spacing:3px;font-weight:700;}
.ovc .os{font-size:64px;font-weight:900;margin:8px 0;color:#FF6B00;}
.ovc .ou{font-size:14px;color:#888;margin-bottom:4px;}
.ovc .ob{font-size:14px;color:#FFD700;margin-bottom:20px;}
@keyframes nb{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.ovc .ob.nw{animation:nb .5s ease 3;}

/* 이름 입력 */
.name-input{
  width:100%;padding:12px;border:2px solid #eee;border-radius:12px;
  font-size:16px;font-family:inherit;text-align:center;outline:none;
  margin-bottom:12px;
}
.name-input:focus{border-color:#FF6B00;}
.name-row{display:none;margin-bottom:16px;}
.name-row.show{display:block;}

.ovc button{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:6px;transition:all .2s;}
.ovc button:hover{transform:translateY(-2px);}
.ovc .bp{background:#1a1a1a;color:#fff;}
.ovc .bc{background:#f5f5f5;color:#888;}

/* 시작 화면 */
.start-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;z-index:3000;}
.start-overlay.hide{display:none;}
.start-card{text-align:center;}
.start-card .st-emoji{font-size:80px;margin-bottom:16px;}
.start-card .st-title{font-size:36px;font-weight:900;}
.start-card .st-title span{color:#FF6B00;}
.start-card .st-sub{font-size:14px;color:#aaa;margin:8px 0 24px;}
.start-card .st-btn{padding:16px 48px;background:#FF6B00;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;}
.start-card .st-btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(255,107,0,0.3);}
</style>
</head>
<body>

<div class="app">
  <!-- 상단 바 -->
  <div class="topbar">
    <div class="logo"><span class="logo-m">Make</span><span class="logo-10">10</span></div>
    <div class="timer" id="tm">2:00</div>
    <div class="score-box">
      <div class="score-label">SCORE</div>
      <div class="score-val" id="sc">0</div>
    </div>
  </div>

  <!-- 게임판 -->
  <div class="board" id="bd"></div>
  <div class="hint">👆 Drag to select numbers that add up to 10</div>

  <!-- 하단: 랭킹 + 히스토리 -->
  <div class="bottom-panels">
    <div class="panel">
      <div class="panel-title">🏆 TOP SCORES</div>
      <div id="rankList"><div class="rank-empty">No scores yet</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">📋 MY HISTORY</div>
      <div id="histList"><div class="rank-empty">No games yet</div></div>
    </div>
  </div>
</div>

<div id="box"></div>
<div id="ls"></div>

<!-- 시작 화면 -->
<div class="start-overlay" id="startOv">
  <div class="start-card">
    <div class="st-emoji">🍊</div>
    <div class="st-title">Make <span>10</span></div>
    <div class="st-sub">Drag numbers that add up to 10!<br>2 minutes. How many can you clear?</div>
    <button class="st-btn" onclick="startGame()">▶ START</button>
  </div>
</div>

<!-- 게임오버 -->
<div class="ov" id="ov">
  <div class="ovc">
    <div class="ol">GAME OVER</div>
    <div class="os" id="fs">0</div>
    <div class="ou">tiles cleared</div>
    <div class="ob" id="fb"></div>
    <div class="name-row" id="nameRow">
      <input class="name-input" id="nameInput" placeholder="Enter your name" maxlength="12">
    </div>
    <button class="bp" id="playBtn" onclick="onPlayAgain()">▶ Play Again</button>
    <button class="bc" onclick="cp()">📋 Share Result</button>
  </div>
</div>

<script>
var R=10,C=17,T=[],S=0,TL=120,TI=null,ON=false;
var DRAG=false,SX=0,SY=0,SEL=[];

// 랭킹 (LocalStorage, 최대 10명)
function getRanks(){
  try{return JSON.parse(localStorage.getItem('m10ranks')||'[]');}catch(e){return[];}
}
function saveRank(name,score){
  var ranks=getRanks();
  ranks.push({name:name,score:score,date:new Date().toISOString().slice(0,10)});
  ranks.sort(function(a,b){return b.score-a.score;});
  if(ranks.length>10)ranks=ranks.slice(0,10);
  localStorage.setItem('m10ranks',JSON.stringify(ranks));
  renderRanks();
}
function renderRanks(){
  var ranks=getRanks();
  var el=document.getElementById('rankList');
  if(ranks.length===0){el.innerHTML='<div class="rank-empty">No scores yet</div>';return;}
  el.innerHTML=ranks.map(function(r,i){
    var cls=i===0?'g':i===1?'s':i===2?'b':'';
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    return '<div class="rank-item"><span class="rank-pos '+cls+'">'+medal+'</span><span class="rank-name">'+r.name+'</span><span class="rank-score">'+r.score+'</span></div>';
  }).join('');
}

// 히스토리 (LocalStorage, 최근 20개)
function getHistory(){
  try{return JSON.parse(localStorage.getItem('m10hist')||'[]');}catch(e){return[];}
}
function saveHistory(score){
  var hist=getHistory();
  var now=new Date();
  var ts=now.toLocaleDateString('en',{month:'short',day:'numeric'})+' '+now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',hour12:false});
  hist.unshift({score:score,date:ts});
  if(hist.length>20)hist=hist.slice(0,20);
  localStorage.setItem('m10hist',JSON.stringify(hist));
  renderHistory();
}
function renderHistory(){
  var hist=getHistory();
  var el=document.getElementById('histList');
  if(hist.length===0){el.innerHTML='<div class="rank-empty">No games yet</div>';return;}
  el.innerHTML=hist.map(function(h,i){
    return '<div class="hist-item"><span class="hist-num">'+(i+1)+'</span><span class="hist-score">'+h.score+' tiles</span><span class="hist-date">'+h.date+'</span></div>';
  }).join('');
}

// 보드
function makeBoard(){
  var b=[];for(var i=0;i<R*C;i++)b.push(Math.floor(Math.random()*9)+1);
  return b;
}

function draw(){
  var bd=document.getElementById('bd');
  bd.innerHTML='';
  for(var i=0;i<T.length;i++){
    var d=document.createElement('div');
    var v=T[i];
    d.className='t'+(v===0?' dead':'');
    if(v>0){
      d.innerHTML='<span class="bg"><svg viewBox="0 0 100 100">'
        +'<ellipse cx="50" cy="55" rx="46" ry="42" fill="#FFA726"/>'
        +'<path d="M50 14 Q44 2 38 8 Q44 0 50 6 Q56 0 62 8 Q56 2 50 14Z" fill="#66BB6A"/>'
        +'</svg></span><span class="num">'+v+'</span>';
    }
    d.dataset.i=i;
    bd.appendChild(d);
  }
}

function getRects(){
  var cells=document.querySelectorAll('.t');
  var arr=[];
  cells.forEach(function(c,i){var r=c.getBoundingClientRect();arr.push({l:r.left,t:r.top,r:r.right,b:r.bottom});});
  return arr;
}

// 드래그 — 화면 전체에서 가능
document.addEventListener('mousedown',function(e){dn(e.clientX,e.clientY);});
document.addEventListener('mousemove',function(e){if(DRAG)mv(e.clientX,e.clientY);});
document.addEventListener('mouseup',function(){up();});
document.addEventListener('touchstart',function(e){e.preventDefault();dn(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();if(DRAG)mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
document.addEventListener('touchend',function(){up();});

function dn(x,y){
  if(!ON)return;
  DRAG=true;SX=x;SY=y;SEL=[];
  var box=document.getElementById('box');
  box.style.display='block';box.style.left=x+'px';box.style.top=y+'px';box.style.width='0';box.style.height='0';
  clr();
}

function mv(x,y){
  var box=document.getElementById('box');
  var x1=Math.min(SX,x),y1=Math.min(SY,y),x2=Math.max(SX,x),y2=Math.max(SY,y);
  box.style.left=x1+'px';box.style.top=y1+'px';box.style.width=(x2-x1)+'px';box.style.height=(y2-y1)+'px';
  var rects=getRects();var cells=document.querySelectorAll('.t');
  SEL=[];var sum=0;
  for(var i=0;i<rects.length;i++){
    if(T[i]===0)continue;
    var cx=(rects[i].l+rects[i].r)/2,cy=(rects[i].t+rects[i].b)/2;
    if(cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2){cells[i].classList.add('sel');SEL.push(i);sum+=T[i];}
    else{cells[i].classList.remove('sel');}
  }
  var ls=document.getElementById('ls');
  if(SEL.length>0){ls.textContent=sum+(sum===10?' ✓':'');ls.className='show '+(sum===10?'ok':sum>10?'ov':'pt');ls.style.left=x+'px';ls.style.top=y+'px';}
  else{ls.className='';}
}

function up(){
  if(!DRAG)return;DRAG=false;
  document.getElementById('box').style.display='none';
  document.getElementById('ls').className='';
  if(SEL.length===0)return;
  var sum=0;for(var i=0;i<SEL.length;i++)sum+=T[SEL[i]];
  if(sum===10){
    var cells=document.querySelectorAll('.t');
    var first=cells[SEL[0]].getBoundingClientRect();
    showPop('+'+SEL.length,first.left+first.width/2,first.top);
    var cx=0,cy=0;
    for(var i=0;i<SEL.length;i++){var r=cells[SEL[i]].getBoundingClientRect();cx+=(r.left+r.right)/2;cy+=(r.top+r.bottom)/2;}
    cx/=SEL.length;cy/=SEL.length;
    for(var i=0;i<SEL.length;i++){
      T[SEL[i]]=0;var el=cells[SEL[i]];el.classList.remove('sel');
      var er=el.getBoundingClientRect();var dx=cx-(er.left+er.right)/2,dy=cy-(er.top+er.bottom)/2;
      el.classList.add('gather');el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.1)';
    }
    (function(idxs){setTimeout(function(){
      for(var j=0;j<idxs.length;j++){var e=cells[idxs[j]];e.classList.remove('gather');e.style.transform='';
        e.classList.add('f'+Math.floor(Math.random()*6));
        (function(ee){setTimeout(function(){ee.classList.add('dead');ee.innerHTML='';},450);})(e);}
    },300);})(SEL.slice());
    S+=SEL.length;document.getElementById('sc').textContent=S;
  }
  clr();SEL=[];
}

function clr(){document.querySelectorAll('.t.sel').forEach(function(c){c.classList.remove('sel');});}
function showPop(t,x,y){var d=document.createElement('div');d.className='sp';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(function(){d.remove();},800);}

// 타이머
function tick(){
  TL--;var m=Math.floor(TL/60),s=TL%60;
  var el=document.getElementById('tm');
  el.textContent=m+':'+String(s).padStart(2,'0');
  if(TL<=10)el.classList.add('warn');else el.classList.remove('warn');
  if(TL<=0){clearInterval(TI);end();}
}

// 시작
function startGame(){
  document.getElementById('startOv').classList.add('hide');
  go();
}
function go(){
  S=0;ON=true;TL=120;
  document.getElementById('ov').classList.remove('on');
  T=makeBoard();draw();
  document.getElementById('sc').textContent='0';
  document.getElementById('tm').textContent='2:00';
  document.getElementById('tm').classList.remove('warn');
  clearInterval(TI);TI=setInterval(tick,1000);
}

// 게임 끝
function end(){
  ON=false;clearInterval(TI);
  saveHistory(S);
  document.getElementById('fs').textContent=S;
  var ranks=getRanks();
  var isTop=ranks.length<10||S>ranks[ranks.length-1].score;
  var nr=document.getElementById('nameRow');
  var fb=document.getElementById('fb');
  if(isTop&&S>0){
    nr.classList.add('show');
    fb.textContent='🎉 NEW HIGH SCORE!';
    fb.className='ob nw';
    document.getElementById('playBtn').textContent='Save & Play Again';
  }else{
    nr.classList.remove('show');
    fb.textContent=ranks.length>0?'Top: '+ranks[0].score:'';
    fb.className='ob';
    document.getElementById('playBtn').textContent='▶ Play Again';
  }
  document.getElementById('nameInput').value='';
  document.getElementById('ov').classList.add('on');
}

function onPlayAgain(){
  var nr=document.getElementById('nameRow');
  if(nr.classList.contains('show')){
    var name=document.getElementById('nameInput').value.trim()||'Player';
    saveRank(name,S);
  }
  go();
}

function cp(){
  var t='🍊 Make 10\n🏆 Score: '+S+' tiles\n\nCan you beat me?';
  navigator.clipboard.writeText(t).then(function(){alert('Copied!');});
}

// 초기화
renderRanks();
renderHistory();
</script>
</body>
</html>
