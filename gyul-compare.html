<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#f5f5f5;padding:40px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center;}
.option{text-align:center;}
.option h3{margin-bottom:12px;font-size:14px;color:#888;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.t{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.t .bg{position:absolute;width:85%;height:85%;}
.t .bg svg{width:100%;height:100%;}
.t .num{position:relative;z-index:1;font-size:18px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5);}
</style>
</head>
<body>

<!-- A: 현재 (진한 오렌지) -->
<div class="option">
<h3>A. 현재 (진한 오렌지)</h3>
<div class="grid">
<div class="t" data-n="1"><span class="bg"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="42" ry="38" fill="#FF8C00"/><ellipse cx="50" cy="55" rx="42" ry="38" fill="url(#gA)"/><ellipse cx="38" cy="48" rx="12" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-20,38,48)"/><path d="M50 18 Q45 8 40 12 Q44 6 50 10 Q56 6 60 12 Q55 8 50 18Z" fill="#4CAF50"/><defs><radialGradient id="gA" cx="40%" cy="35%"><stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#F57C00"/></radialGradient></defs></svg></span><span class="num">1</span></div>
<div class="t"><span class="bg"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="42" ry="38" fill="#FF8C00"/><ellipse cx="50" cy="55" rx="42" ry="38" fill="url(#gA)"/><ellipse cx="38" cy="48" rx="12" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-20,38,48)"/><path d="M50 18 Q45 8 40 12 Q44 6 50 10 Q56 6 60 12 Q55 8 50 18Z" fill="#4CAF50"/></svg></span><span class="num">5</span></div>
<div class="t"><span class="bg"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="42" ry="38" fill="#FF8C00"/><ellipse cx="50" cy="55" rx="42" ry="38" fill="url(#gA)"/><ellipse cx="38" cy="48" rx="12" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-20,38,48)"/><path d="M50 18 Q45 8 40 12 Q44 6 50 10 Q56 6 60 12 Q55 8 50 18Z" fill="#4CAF50"/></svg></span><span class="num">9</span></div>
