<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:800px;height:400px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#0f0f0f;
  font-family:'Outfit',sans-serif;position:relative;
}
/* 글로우 배경 */
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.6;}
.g1{width:400px;height:400px;top:-100px;left:-50px;background:#FF6B00;}
.g2{width:300px;height:300px;bottom:-80px;right:-40px;background:#FF4D6D;}
.g3{width:200px;height:200px;top:50px;right:120px;background:#FFB74D;opacity:0.3;}

.card{text-align:center;position:relative;z-index:1;}

/* 귤 */
.tangerine{position:relative;display:inline-block;margin-bottom:12px;}
.tangerine .emoji{font-size:90px;display:block;}
.tangerine .ring{position:absolute;inset:-16px;border:2px solid rgba(255,255,255,0.15);border-radius:50%;animation:spin 8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.title{font-size:52px;font-weight:900;color:#fff;letter-spacing:-1px;}
.title span{background:linear-gradient(135deg,#FFB74D,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:16px;color:rgba(255,255,255,0.5);margin-top:6px;letter-spacing:3px;text-transform:uppercase;font-weight:700;}

.tags{display:flex;gap:8px;justify-content:center;margin-top:16px;}
.tag{padding:5px 14px;background:rgba(255,255,255,0.08);border-radius:16px;font-size:12px;color:rgba(255,255,255,0.6);font-weight:600;border:1px solid rgba(255,255,255,0.08);}

/* 작은 귤 장식 */
.mini{position:absolute;font-size:28px;opacity:0.3;}
.m1{top:40px;left:60px;transform:rotate(-15deg);}
.m2{bottom:50px;left:120px;transform:rotate(20deg);font-size:22px;}
.m3{top:60px;right:80px;transform:rotate(10deg);font-size:20px;}
.m4{bottom:40px;right:100px;transform:rotate(-25deg);font-size:32px;}
.m5{top:160px;left:30px;transform:rotate(30deg);font-size:18px;opacity:0.15;}
.m6{bottom:120px;right:40px;transform:rotate(-10deg);font-size:16px;opacity:0.15;}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<div class="mini m1">🍊</div>
<div class="mini m2">🍊</div>
<div class="mini m3">🍊</div>
<div class="mini m4">🍊</div>
<div class="mini m5">🍊</div>
<div class="mini m6">🍊</div>

<div class="card">
  <div class="tangerine">
    <span class="emoji">🍊</span>
    <div class="ring"></div>
  </div>
  <div class="title">Tangerine <span>10</span></div>
  <div class="sub">Number Puzzle Game</div>
  <div class="tags">
    <span class="tag">🎯 Drag & Match</span>
    <span class="tag">⏱ 2 Min Challenge</span>
    <span class="tag">🏆 Global Ranking</span>
  </div>
</div>
</body>
</html>
