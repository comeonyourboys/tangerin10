<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#fff8f0,#ffe9d2);position:relative;display:flex;align-items:center}
.dots{position:absolute;inset:0;background-image:radial-gradient(#f9b87a 2px,transparent 2px);background-size:34px 34px;opacity:.35}
.wrap{position:relative;padding:0 72px;display:flex;align-items:center;justify-content:space-between;width:100%}
.left{max-width:640px}
.kicker{font-size:22px;font-weight:800;letter-spacing:5px;color:#ea580c;text-transform:uppercase}
h1{font-size:82px;font-weight:900;letter-spacing:-3px;line-height:1.02;margin:14px 0 0;color:#1a1a1a}
h1 span{color:#f97316}
p{margin-top:20px;font-size:29px;font-weight:600;color:#7a5a42;line-height:1.4}
.chips{display:flex;gap:11px;margin-top:26px}
.chip{background:#fff;border:3px solid #1a1a1a;border-radius:999px;padding:10px 20px;font-size:20px;font-weight:800;color:#1a1a1a}
.url{position:absolute;left:72px;bottom:44px;font-size:21px;font-weight:800;color:#c2794a;letter-spacing:1px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;flex-shrink:0}
.t{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffb457,#f4841f);display:grid;place-items:center;font-size:37px;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(180,90,10,.32)}
.t.on{background:radial-gradient(circle at 34% 30%,#fff0d8,#ffd9a1);color:#c2560a;outline:5px solid #16a34a}
</style></head><body>
<div class="dots"></div>
<div class="wrap">
  <div class="left">
    <div class="kicker">Free Puzzle Game</div>
    <h1>Tangerine <span>10</span></h1>
    <p>Drag numbers that add up to&nbsp;10.<br>Two minutes. How many can you clear?</p>
    <div class="chips"><span class="chip">🍊 No sign-up</span><span class="chip">⏱ 2 minutes</span><span class="chip">🏆 Leaderboard</span></div>
  </div>
  <div class="board">
    <div class="t">3</div><div class="t on">7</div><div class="t on">3</div><div class="t">8</div>
    <div class="t">5</div><div class="t">2</div><div class="t">9</div><div class="t">4</div>
    <div class="t">6</div><div class="t on">1</div><div class="t on">9</div><div class="t">2</div>
    <div class="t">4</div><div class="t">8</div><div class="t">5</div><div class="t">7</div>
  </div>
</div>
<div class="url">tangerin10.web.app</div>
</body></html>
