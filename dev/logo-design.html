<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:1024px;overflow:hidden;font-family:Outfit,sans-serif;background:linear-gradient(145deg,#fff4e6 0%,#ffd9a1 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1a1a1a}
.dots{position:absolute;inset:0;background-image:radial-gradient(#f9b87a 3px,transparent 3px);background-size:48px 48px;opacity:.4}
.sym{font-size:460px;line-height:1;filter:drop-shadow(0 30px 50px rgba(180,90,10,.35));position:relative;top:-20px}
.t{position:relative;font-size:118px;font-weight:900;letter-spacing:-4px}
.t span{color:#f97316}
.s{position:relative;font-size:36px;font-weight:700;letter-spacing:12px;color:#c2794a;margin-top:12px}
</style></head><body>
<div class="dots"></div>
<div class="sym">🍊</div>
<div class="t">Tangerine <span>10</span></div>
<div class="s">MAKE 10 PUZZLE</div>
</body></html>
